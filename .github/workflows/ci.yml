name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backend/api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  mqtt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend/mqtt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backend/mqtt/package-lock.json
      - run: npm ci
      - run: npm run typecheck
