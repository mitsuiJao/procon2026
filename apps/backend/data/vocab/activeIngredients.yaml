# 有効成分マスター。ISO 共通名 → FRAC コード。農薬（商品）データが有効成分を介して FRAC コードを引くための表。
# 出典: FRAC Code List 2026 の (ISO) COMMON NAME 欄 = sources.yaml の S063。
#
# id            共通名の小文字（空白・記号はハイフン）。不変。
# nameEn        PDF の表記。
# nameJa        日本語名（任意）。このプロジェクトの資料で使ったものだけ。
# fracCode      frac.yaml の code。
# chemicalGroup PDF の Chemical or Biological Group 欄。
# aliases       別名（任意）。
# note          補足（任意）。
#
# 収録範囲: 化学的な有効成分。微生物株（BM02 の多数の株、P06）、植物抽出物（BM01）、未分類（NC）は収録していない。
#           そのため frac.yaml の P06 / NC / BM01 には、対応する有効成分の行がない。
#           ブドウの灰色かび病で使われる Bacillus subtilis だけは収録している。
#           ※ 商品名・登録状況・使用基準はこの表の対象外（農林水産省の農薬登録情報提供システムで確認する）。

