# FRAC コード表（作用機構グループ）。ルールの candidateFrac、activeIngredients の fracCode が参照する。
# 出典: FRAC Code List 2026（最終更新 2026年5月）= sources.yaml の S063。
# 利用条件: 教育目的の利用は許諾不要。商用利用は FRAC の事前許可が必要（PDF の Disclaimer）。
#
# code            参照キー（文字列）。公式表記から空白を除いたもの（"P 07" → P07, "BM 02" → BM02）。
#                 ただし M 系だけは既存データに合わせてゼロ埋めなし（"M 01" → M1）。
# label           公式の表示（"M 01" など）。ラベルや資料との照合用。
# category        MOA の大分類。
#                   A 核酸代謝・クロマチン調節 / B 細胞骨格・モータータンパク質 / C 呼吸
#                   D アミノ酸・タンパク質合成 / E シグナル伝達 / F 脂質合成・輸送・膜の完全性
#                   G 膜のステロール生合成 / H 細胞壁生合成 / I 細胞壁のメラニン合成
#                   J RNA 干渉 / M 多作用点 / P 宿主植物の防御誘導 / U 作用機構不明
#                   NC 未分類 / BM 複数の作用機構を持つ生物由来
# targetSiteCode  標的部位コード（A1, C3 など）。M/P/U/NC/BM は null。
# groupName       FRAC の Group Name。空欄のものは化学グループ名。
# nameJa          日本語名（任意）。既存データにあるものだけ。
# resistanceRisk  FRAC の記載。low | low_medium | medium | medium_high | high | not_stated
# riskAssumed     true = FRAC が「想定値（assumed）」と書いているもの。
# note            PDF の Comments 欄の要約（日本語）。ニュアンスが重要なときは PDF の原文を見ること。

